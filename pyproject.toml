[project]
name = "paper1"
version = "1.0.0"
description = "Analysis code and data behind the registered numbers of paper 1 (frozen 9B agent, tau2-bench retail and BFCL multi-turn)"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["paper1", "paper1.fgate", "paper1.bfcl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
